<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>Drawing: the Commit changes box</title>
  <rect width="560" height="430" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="40" font-size="18" font-weight="600" fill="#1f2328">Commit changes</text>
  <text x="24" y="76" font-weight="600" fill="#1f2328">Commit message</text>
  <rect x="24" y="86" width="512" height="34" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="34" y="108" fill="#1f2328">Feature 1: add the trial box</text>
  <rect x="16" y="56" width="528" height="72" rx="8" fill="none" stroke="#d1242f" stroke-width="3"/>
  <text x="24" y="156" font-weight="600" fill="#1f2328">Extended description</text>
  <rect x="24" y="166" width="512" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="34" y="190" fill="#8c959f">Add an optional extended description...</text>
  <circle cx="34" cy="256" r="7" fill="#ffffff" stroke="#0969da" stroke-width="2"/><circle cx="34" cy="256" r="3.5" fill="#0969da"/>
  <text x="50" y="261" fill="#1f2328">Commit directly to the <tspan font-family="Menlo, Consolas, monospace" fill="#0969da">main</tspan> branch</text>
  <rect x="18" y="240" width="300" height="32" rx="6" fill="none" stroke="#d1242f" stroke-width="3"/>
  <circle cx="34" cy="292" r="7" fill="#ffffff" stroke="#8c959f"/>
  <text x="50" y="297" fill="#59636e">Create a new branch for this commit...</text>
  <line x1="0" y1="330" x2="560" y2="330" stroke="#d0d7de"/>
  <rect x="300" y="350" width="80" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text x="318" y="372" fill="#1f2328">Cancel</text>
  <rect x="392" y="350" width="144" height="34" rx="6" fill="#1f883d"/><text x="408" y="372" fill="#ffffff" font-weight="600">Commit changes</text>
  <rect x="384" y="342" width="160" height="50" rx="10" fill="none" stroke="#d1242f" stroke-width="3"/>
  <text x="24" y="372" fill="#d1242f" font-weight="600">Type the message,</text>
  <text x="24" y="392" fill="#d1242f" font-weight="600">leave main selected, then click.</text>
  <text x="24" y="420" fill="#59636e" font-size="12">A drawing, not a screenshot. Your screen may look a little different.</text>
</svg>
